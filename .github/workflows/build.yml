name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build and run core checks
        shell: powershell
        run: .\scripts\test.ps1

      - name: Upload application artifact
        uses: actions/upload-artifact@v6
        with:
          name: VideoHarvester-Windows
          path: |
            artifacts/bin/VideoHarvester.exe
            artifacts/bin/VideoHarvester.exe.config
          if-no-files-found: error
          retention-days: 14
